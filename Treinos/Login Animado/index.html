<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="shape1"></div>
        <div id="shape2"></div>
        <div id="shape3"></div>
        <div class="login">
            <div class="login-form">
                <form action="cadastro.php" method="post" autocomplete="on">
                    <h1>Login Form</h1>
                    <div class="login-body">
                        <div class="inputbox">
                            <input type="text" name="username" id="username" required autocomplete="name"> <span>Username</span>
                            <i></i>
                        </div>
                        <!--Fim do Input Box-->

                        <div class="inputbox">
                            <input type="password" name="password" id="password" required minlength="8" autocomplete="current-password"> <span>Password</span>
                            <i></i>
                        </div>
                        <!--Fim do Input Box-->

                        <div class="inputbox">
                            <a href="#">Forgot Password?</a>
                        </div>
                        <!--Fim do Input Box-->

                        <div class="inputbox">
                            <input type="submit" value="Login" name="login" id="login">
                        </div>
                        <!--Fim do Input Box-->

                    </div>
                    <div class="login-with">
                        <h1>Login With</h1>
                        <span class="fb"></span>
                        <span class="gmail"></span>
                        <span class="twitter"></span>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
