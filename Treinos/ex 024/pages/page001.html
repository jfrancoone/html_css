<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url('../images/img.jpg');
            background-size: cover;
        }
        *{
            margin: 0px;
        }
        div{
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.774);
        }
        div > h1{
            position: absolute;
            display: block;
            color: white;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(to right, #2f3a59, #738cbf);
            padding: 20px;
            border-radius: 15px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }

    </style>
</head>
<body>
    <div>
        <h1>HI! It's the main page of my iframe</h1>
    </div>
</body>
</html>
