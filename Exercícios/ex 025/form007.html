<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: 'Orbitron';
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iest">Estado: </label> 
            <select name="estado" id="iest">
                <optgroup label="Região Norte">
                    <option>Luanda</option>
                    <option>Benguela</option>
                    <option>Cabinda</option>
                    <option>Malange</option>
                </optgroup>
                <optgroup label="Região Sul">
                    <option>Uíge</option>
                    <option>Kuanza Sul</option>
                    <option>Kuanza Norte</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Profissão: </label>
            <input type="text" name="prof" id="iprof" list="listprof">
            <datalist id="listprof">
                <option>Desenvolvedor</option>
                <option>Professor</option>
                <option>Contablista</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label> <br>
            <textarea placeholder="Sua mensagem aqui" name="msg" id="imsg" cols="30" rows="10" style="width: 200px; height: 200px; border-radius: 15px; padding: 10px;"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
