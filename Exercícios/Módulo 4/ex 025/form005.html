<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: 'Orbitron';
        }
        form fieldset{
            border-radius: 10px;
            width: 75vw;
            max-width: 800px;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexmas"> <label for="isexmas">Masculino</label> <br>
            <input type="radio" name="sexo" id="isexfem"> <label for="isexfem">Femenino</label>


        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>

            <input type="checkbox" name="esfut" id="iesfut"> 
            <label for="iesfut">Futebol </label> <br>

            <input type="checkbox" name="esbas" id="iesbas">
            <label for="iesbas">Basquete </label> <br>

            <input type="checkbox" name="esand" id="iesand">
            <label for="iesand">Andebol </label> <br>

            <input type="checkbox" name="esten" id="iesten">
            <label for="iesten">Ténis de Mesa </label> <br>

            <input type="checkbox" name="esvol" id="iesvol"> 
            <label for="iesvol">Volleibol </label> <br>

        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
